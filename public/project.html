<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Konec Project Management</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="img/logo.png" alt="Konec" class="brand-logo" />
      <span class="brand-sub">Project Management</span>
    </div>
    <div class="topbar-actions">
      <button id="deleteProjectBtn" class="btn btn-sm btn-danger">Delete Project</button>
      <form method="POST" action="logout">
        <button type="submit" class="btn btn-sm">Log out</button>
      </form>
    </div>
  </header>

  <main class="container">
    <a href="." class="back-link">&larr; Back to overview</a>

    <div class="page-header">
      <input id="projectNameInput" class="editable-title" type="text" />
      <div class="field" style="margin:0; max-width:220px;">
        <label for="commissionDateInput">Commission date</label>
        <input type="date" id="commissionDateInput" />
      </div>
    </div>

    <section class="section">
      <h2><span class="accent-dot"></span>Checklist</h2>
      <div id="checklist" class="checklist"></div>
    </section>

    <section class="section">
      <h2><span class="accent-dot"></span>General Notes</h2>
      <div class="field">
        <textarea id="newNoteContent" rows="3" placeholder="Add a general note about this project…"></textarea>
      </div>
      <button id="addNoteBtn" class="btn btn-accent btn-sm">Add Note</button>
      <div id="notesList" style="margin-top:16px;"></div>
    </section>

    <section class="section">
      <h2><span class="accent-dot"></span>Files</h2>
      <div id="dropzone" class="dropzone">
        Drag &amp; drop floor plans, quotes, or other files here — or click to browse
        <input type="file" id="fileInput" multiple class="hidden" />
      </div>
      <div id="fileList" class="file-list"></div>
    </section>

    <section class="section">
      <h2><span class="accent-dot"></span>Konec Markup / Quote</h2>
      <div id="dropzoneMarkup" class="dropzone">
        Drag &amp; drop Konec markup drawings or quotes here — or click to browse
        <input type="file" id="fileInputMarkup" multiple class="hidden" />
      </div>
      <div id="fileListMarkup" class="file-list"></div>
    </section>
  </main>

  <script src="js/fields.js"></script>
  <script src="js/common.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
