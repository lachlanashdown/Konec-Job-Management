<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konec Job Manager — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="img/logo.png" alt="Konec" class="brand-logo brand-logo-lg" />
      <span class="brand-sub">Job Manager</span>
      <div id="loginError" class="login-error hidden">Incorrect password. Please try again.</div>
      <form method="POST" action="login">
        <div class="field" style="text-align:left">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autofocus required />
        </div>
        <button type="submit" class="btn btn-accent" style="width:100%">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('loginError').classList.remove('hidden');
    }
  </script>
</body>
</html>
