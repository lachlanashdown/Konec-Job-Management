<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konec Project Management</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="img/logo.png" alt="Konec" class="brand-logo" />
      <span class="brand-sub">Project Management</span>
    </div>
    <div class="topbar-actions">
      <a href="api/backup" class="btn btn-sm btn-backup" download>Download Backup</a>
      <button id="restoreBackupBtn" class="btn btn-sm btn-backup">Restore Backup</button>
      <input type="file" id="restoreFileInput" accept=".zip" class="hidden" />
      <form method="POST" action="logout">
        <button type="submit" class="btn btn-sm btn-outline-backup">Log out</button>
      </form>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Jobs Overview</h1>
      <button id="newProjectBtn" class="btn btn-accent">+ New Project</button>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by project name or Konec Link ID…" />
    </div>

    <div id="projectGrid" class="project-grid"></div>
    <div id="emptyState" class="empty-state hidden">
      No projects yet. Click <strong>+ New Project</strong> to add your first job.
    </div>
  </main>

  <div id="newProjectModal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>New Project</h2>
      <form id="newProjectForm">
        <div class="field">
          <label for="projectName">Project name</label>
          <input type="text" id="projectName" required placeholder="e.g. 12 Wattle St Rewire" />
        </div>
        <div class="field">
          <label for="projectCommissionDate">Commission date</label>
          <input type="date" id="projectCommissionDate" />
        </div>
        <div class="field">
          <label for="projectKonecLinkId">Konec Link ID</label>
          <input type="text" id="projectKonecLinkId" placeholder="ID" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelNewProject">Cancel</button>
          <button type="submit" class="btn btn-accent">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/fields.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
