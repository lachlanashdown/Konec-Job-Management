<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konec Job Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="img/logo.png" alt="Konec" class="brand-logo" />
      <span class="brand-sub">Job Manager</span>
    </div>
    <div class="topbar-actions">
      <a href="api/backup" class="btn btn-sm btn-backup" download>Download Backup</a>
      <button id="restoreBackupBtn" class="btn btn-sm btn-backup">Restore Backup</button>
      <input type="file" id="restoreFileInput" accept=".zip" class="hidden" />
      <form method="POST" action="logout">
        <button type="submit" class="btn btn-sm btn-outline-backup">Log out</button>
      </form>
    </div>
  </header>

  <nav class="main-nav">
    <a href="." class="nav-link active">Home</a>
    <a href="projects" class="nav-link">Project Manager</a>
    <a href="aftersales" class="nav-link">Aftersales</a>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Job Manager</h1>
    </div>

    <div class="home-cards">
      <a class="home-card" href="projects">
        <h2>Project Manager</h2>
        <p>Jobs, checklists, homes/units, hours attended and files.</p>
      </a>
      <a class="home-card" href="aftersales">
        <h2>Aftersales</h2>
        <p>Every aftersales case across every job, in one table.</p>
      </a>
    </div>

    <section class="section">
      <h2><span class="accent-dot"></span>Recent Activity</h2>
      <div id="activityList"></div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
